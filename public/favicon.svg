<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Latar Belakang Kotak Burgundy dengan Corner Radius Lembut -->
  <rect width="512" height="512" rx="96" fill="#6D1A2B" />

  <!-- Monogram R Cream dengan Smiling Leg & Playful Bowl -->
  <g fill="#F5EBDD">
    <!-- Batang Utama Vertikal (Stem) -->
    <path d="M 128,100 H 200 V 412 H 128 Z" />
    
    <!-- Mangkuk/Loop Atas (Bowl) -->
    <path d="M 200,100 H 310 C 380,100 410,140 410,200 C 410,260 380,295 310,295 H 200 Z 
             M 200,170 H 295 C 330,170 340,182 340,200 C 340,218 330,225 295,225 H 200 Z" />
    
    <!-- Kaki Melengkung Senyum (Smiling Leg) -->
    <path d="M 240,265 C 280,265 315,290 345,330 C 375,370 390,395 435,405 C 450,408 460,400 445,375 C 415,320 370,260 300,220 Z" />
  </g>
</svg>