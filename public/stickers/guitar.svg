<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Filter Outer Stroke Cream 6px (Sticker Effect) -->
    <filter id="cream-stroke-guitar" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded" />
      <feFlood flood-color="#F5EBDD" result="creamColor" />
      <feComposite in="creamColor" in2="expanded" operator="in" result="creamStroke" />
      <feMerge>
        <feMergeNode in="creamStroke" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#cream-stroke-guitar)" fill="#000000">
    <!-- Badan Gitar (Body Outline & Sound Hole) -->
    <path fill-rule="evenodd" d="
      M 32,32 
      C 37,25 50,22 62,32 
      C 74,42 77,55 70,68 
      C 63,81 48,88 33,85 
      C 18,82 10,68 15,53 
      C 19,42 27,39 32,32 Z
      M 38,55 
      A 7,7 0 1,0 52,55 
      A 7,7 0 1,0 38,55 Z" />

    <!-- Leher Gitar (Neck) -->
    <rect x="52" y="32" width="28" height="8" rx="2" transform="rotate(-45 52 32)" />

    <!-- Kepala Gitar (Headstock) -->
    <path d="M 69,18 L 81,30 L 75,36 L 63,24 Z" />
  </g>
</svg>