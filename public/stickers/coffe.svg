<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Filter untuk stroke cream 6px di luar icon -->
    <filter id="cream-stroke" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded" />
      <feFlood flood-color="#F5EBDD" result="creamColor" />
      <feComposite in="creamColor" in2="expanded" operator="in" result="creamStroke" />
      <feMerge>
        <feMergeNode in="creamStroke" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#cream-stroke)" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Uap Panas (3 garis bergelombang) -->
    <path d="M 43,29 C 41,33 45,36 43,40" />
    <path d="M 50,29 C 48,33 52,36 50,40" />
    <path d="M 57,29 C 55,33 59,36 57,40" />

    <!-- Badan Cangkir -->
    <path d="M 33,45 H 67 C 67,45 65,69 50,69 C 35,69 33,45 33,45 Z" fill="#FFFFFF" />

    <!-- Pegangan Cangkir (Handle) -->
    <path d="M 66,48 C 72,48 74,53 72,58 C 70,61 65,60 65,60" />

    <!-- Tatakan / Piring Alas -->
    <line x1="32" y1="74" x2="68" y2="74" />
  </g>
</svg>